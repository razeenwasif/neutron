# What has to be true of every commit.
#
# macOS is the shipped target (`Neutron.app`).
# The Linux job validates all platform-independent crates plus `neutron-plugin`'s
# `#![cfg(unix)]` child-process integration suite and enforces pure-Rust crypto.
#
# Deliberately absent: `cargo fmt --check`. This tree is hand-formatted and does
# not match rustfmt's output, so that check would fail on every commit.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: macOS (shipped target)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test native backends and workspace
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build application bundle
        run: cargo xtask bundle
      - name: Verify bundle
        run: |
          plutil -lint target/release/Neutron.app/Contents/Info.plist
          codesign --verify --deep --strict target/release/Neutron.app
          target/release/Neutron.app/Contents/MacOS/neutron --bench . 1
      - name: Archive application
        run: ditto -c -k --sequesterRsrc --keepParent target/release/Neutron.app target/release/Neutron-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Neutron-macOS
          path: target/release/Neutron-macOS.zip

  linux:
    name: Linux (headless crates & plugin integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: The crypto backend must stay pure Rust
        shell: bash
        run: |
          if cargo tree --invert aws-lc-rs --edges normal >/dev/null 2>&1; then
            echo "::error::aws-lc-rs is back in the dependency tree. Pin russh to ring."
            exit 1
          fi
          echo "aws-lc-rs is absent, as it should be."
      - name: Test platform-independent crates
        run: >
          cargo test
          -p neutron-core
          -p neutron-ui
          -p neutron-fuzzy
          -p neutron-archive
          -p neutron-plugin
          --locked
      - name: Clippy
        run: >
          cargo clippy
          -p neutron-core
          -p neutron-ui
          -p neutron-fuzzy
          -p neutron-archive
          -p neutron-plugin
          --all-targets --locked -- -D warnings
