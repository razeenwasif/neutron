[workspace]
resolver = "3"
members = [
    "crates/neutron-app",
    "crates/neutron-core",
    "crates/neutron-ui",
    "crates/neutron-fuzzy",
    "crates/neutron-index",
    "crates/neutron-shell",
    "crates/neutron-cloud",
    "crates/neutron-indexer",
    "xtask",
]

# xtask is a Linux-side build driver, not part of the shipped application, and
# compiling it with the Windows toolchain is pure waste. Excluding it here means
# the Windows build touches only the crates that actually ship, while
# `cargo xtask ...` still resolves it by name on the Linux side.
default-members = [
    "crates/neutron-app",
    "crates/neutron-core",
    "crates/neutron-ui",
    "crates/neutron-fuzzy",
    "crates/neutron-index",
    "crates/neutron-shell",
    "crates/neutron-cloud",
    "crates/neutron-indexer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/razeenwasif/neutron"

[workspace.dependencies]
# --- internal ---
neutron-core = { path = "crates/neutron-core" }
neutron-ui = { path = "crates/neutron-ui" }
neutron-fuzzy = { path = "crates/neutron-fuzzy" }
neutron-index = { path = "crates/neutron-index" }
neutron-shell = { path = "crates/neutron-shell" }
neutron-cloud = { path = "crates/neutron-cloud" }

# --- ui ---
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "persistence",
] }

# --- concurrency ---
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1.10"

# --- search ---
nucleo-matcher = "0.3"

# --- serialization / storage ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- diagnostics ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

# --- windows ---
windows = "0.62"

# Release builds: optimize hard. This is a file manager whose entire pitch is
# speed, so the extra link time is worth it.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Dev builds are unusably slow for a GUI app unless dependencies are optimized.
# Our own crates stay at opt-level 0 so incremental rebuilds remain fast.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
