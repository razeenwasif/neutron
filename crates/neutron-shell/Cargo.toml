[package]
name = "neutron-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
neutron-core.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
]

[target.'cfg(target_os = "macos")'.dependencies]
# `exception` so an Objective-C exception from AppKit (beginning a drag with
# an unsuitable event, say) becomes an `Err` instead of unwinding through Rust.
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSDate", "NSEnumerator",
    "NSError", "NSFileManager", "NSGeometry", "NSNotification", "NSObject", "NSProcessInfo", "NSString", "NSThread",
    "NSURL", "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "NSApplication", "NSBitmapImageRep",
    "NSColorSpace", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphics",
    "NSCell", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSScreen", "NSSharingService",
    "NSView", "NSWindow", "NSWorkspace",
] }

# Runs on the process's main thread, which AppKit-facing code requires and the
# default test harness never provides.
[[test]]
name = "macos_main_thread"
harness = false
