<!--
  Neutron application icon.

  A folder on the accent chip. The chip is the same rounded square and the same
  145-degree gradient as the brand mark in the sidebar, so the icon and the
  application read as one product; the folder is what says "file explorer" at a
  glance, which the chip alone would not.

  Two values, not three. The back panel and its tab are white at 52%, the front
  panel is solid white — depth from the two sheets differing in value, the same
  trick the previous icon used and the only one that survives 16px. There is
  deliberately no fine detail: at taskbar size it turns to mush.

  This file is the readable source. The shipped rasters are generated from the
  same unit-square geometry by a signed-distance renderer rather than from this
  SVG — see `app_icon` in neutron-app/src/main.rs for why, and for how to
  regenerate them. If you change a number here, change it there too.
-->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0.96">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="1" stop-color="#5B3FD6"/>
    </linearGradient>
  </defs>

  <!-- The chip: full-bleed rounded square, r = 0.215 of the canvas. -->
  <rect x="0" y="0" width="256" height="256" rx="55.04" fill="url(#chip)"/>

  <!-- Back panel and its tab, at 52%: the sheet behind. -->
  <g fill="#FFFFFF" fill-opacity="0.52">
    <rect x="65.28" y="70.40" width="55.04" height="23.04" rx="8.96"/>
    <rect x="65.28" y="80.64" width="125.44" height="89.60" rx="12.80"/>
  </g>

  <!-- Front panel, solid. -->
  <rect x="65.28" y="108.80" width="125.44" height="75.52" rx="14.08" fill="#FFFFFF"/>
</svg>
